<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shed Heater</title>
<style>
:root{--bg:#08090b;--panel:#15181d;--line:#2b2f36;--acc:#29d3ff;--accFg:#00141c;--logBg:#040506;--logFg:#7dffb0;--gLine:#ff2d78;--gRun:#ff8a1f;--gCool:#29d3ff;--grid:#1d2127}
.ln{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.spin{animation:spin 1s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.blink{animation:blink .9s steps(1) infinite}
@keyframes blink{50%{opacity:.25}}
.flick{animation:flick .32s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flick{from{transform:scale(1,1)}to{transform:scale(.88,1.12)}}
.lab{font:700 11px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:.06em}
.bezel{background:#16181c;border:1px solid #2b2f36;border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:16px;box-shadow:inset 0 1px 0 #30353d,0 10px 30px rgba(0,0,0,.5)}
.lcd{background:#040506;border:2px solid #1a1f25;border-radius:12px;padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px}
.lrow{display:flex;justify-content:space-between;align-items:center}
.link{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.08em}
.drow{display:flex;align-items:flex-start;justify-content:center;gap:8px;padding:4px 0}
.dlab{display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:6px;margin-right:4px;color:#29d3ff}
.dlab span{font-size:10px;font-weight:700;letter-spacing:.1em;writing-mode:vertical-rl;transform:rotate(180deg)}
#dig{display:flex;gap:8px}
#dig svg{width:52px;height:95px}
#du{font-size:30px;font-weight:800;padding-top:2px;min-width:44px}
.ptxt{text-align:center;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:12px;font-weight:700;letter-spacing:.1em;color:#29d3ff;min-height:16px}
.brow{display:flex;justify-content:space-between;align-items:center;gap:8px}
#pdig{display:flex;gap:3px}
#pdig svg{width:19px;height:35px}
.btns{display:flex;justify-content:space-around;align-items:flex-start;padding:0 4px}
.rb{display:flex;flex-direction:column;align-items:center;gap:6px}
.rb button{width:62px;height:62px;border-radius:50%;background:#0e1013;border:1px solid #2d3239;box-shadow:0 3px 0 #000,inset 0 1px 0 #2c3138;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;color:#cfd6de;font-size:16px;font-weight:800;letter-spacing:.04em}
.rb button:active{transform:translateY(2px);box-shadow:0 1px 0 #000,inset 0 1px 0 #2c3138}
.rb button:disabled{cursor:default;opacity:.55}
.rb span{font-size:10px;font-weight:700;letter-spacing:.1em;color:#9aa3ad}
.keys{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.keys button{height:46px;border-radius:10px;border:1px solid #2b2f36;font-size:17px;font-weight:700;cursor:pointer;background:#111317;color:#cfd6de}
.keys button.sel{background:#29d3ff;color:#00141c}
</style></head><body>
<div class="wrap">
<div id="hdr"></div>
<div id="alert"></div>

<div class="bezel">
 <div class="lcd">
  <div class="lrow">
   <div class="link" id="link" style="color:#29d3ff">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path class="ln" d="M2 9a15 15 0 0 1 20 0M5.5 12.5a10 10 0 0 1 13 0M9 16a5 5 0 0 1 6 0"/><circle cx="12" cy="19.5" r="1.6" fill="currentColor"/></svg>
    <span id="lmode">--</span>
   </div>
   <svg viewBox="0 0 176 14" width="176" height="14" aria-hidden="true">
    <text x="0" y="11" class="lab" id="lOff">OFF</text><text x="32" y="11" class="lab" id="lStart">START</text>
    <text x="82" y="11" class="lab" id="lRun">RUN</text><text x="114" y="11" class="lab" id="lCool">COOL</text>
    <text x="152" y="11" class="lab" id="lErr">ERR</text>
   </svg>
  </div>
  <div class="drow">
   <div class="dlab"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path class="ln" d="M14 4a2 2 0 0 0-4 0v10.5a4 4 0 1 0 4 0z"/></svg><span id="dlab">CHAMBER</span></div>
   <div id="dig" role="img" aria-label="--"></div>
   <span id="du">&deg;C</span>
  </div>
  <div class="ptxt" id="ptxt"></div>
  <div class="brow">
   <svg viewBox="0 0 120 56" width="132" height="62" role="img" id="hico" aria-label="Heater">
    <path class="ln" id="iAir" d="M2 22h8M2 32h8M7 19l3 3-3 3M7 29l3 3-3 3"/>
    <rect x="16" y="12" width="88" height="30" rx="15" class="ln" style="stroke:#29d3ff"/>
    <circle cx="27" cy="27" r="10" class="ln" id="iFanR"/>
    <g id="iFan"><circle cx="27" cy="27" r="8" fill="none"/><path class="ln" id="iFanB" d="M27 27L27 19.5M27 27L33.5 30.8M27 27L20.5 30.8"/></g>
    <path class="ln" id="iGlow" d="M75 1l3 2-3 2 3 2-3 2 3 2"/>
    <circle cx="75" cy="14" r="2.6" id="iGlowD"/>
    <g id="iFlame" style="transform-origin:72px 39px;transition:transform .5s,opacity .4s"><g class="flick"><path d="M72 39C64 39 61 32 65 26C67 23 67 20 66 16C71 19 73 23 72 27C74 25 75 23 75 21C79 25 80 30 79 33C78 37 75 39 72 39Z" fill="#ff8a1f"/></g></g>
    <path class="ln" style="stroke:#29d3ff" d="M96 42v7h14"/>
   </svg>
   <svg viewBox="0 0 24 30" width="22" height="28" aria-hidden="true" id="iPumpS"><path class="ln" id="iPump" d="M12 3C12 3 5 12 5 18a7 7 0 0 0 14 0c0-6-7-15-7-15z"/></svg>
   <svg viewBox="0 0 66 36" width="66" height="36" aria-hidden="true">
    <rect x="0" y="27" width="8" height="9" id="lv0"/><rect x="11" y="22" width="8" height="14" id="lv1"/><rect x="22" y="17" width="8" height="19" id="lv2"/>
    <rect x="33" y="12" width="8" height="24" id="lv3"/><rect x="44" y="6" width="8" height="30" id="lv4"/><rect x="55" y="0" width="8" height="36" id="lv5"/>
   </svg>
   <div id="pdig"></div>
  </div>
 </div>
 <div class="btns">
  <div class="rb"><button id="bPwr" aria-label="Power" onclick="mainBtn()"><svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path class="ln" d="M12 3v8M6.3 6.8a8 8 0 1 0 11.4 0"/></svg></button><span id="cPwr">POWER</span></div>
  <div class="rb"><button aria-label="Level down" onclick="cmd('down')"><svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path class="ln" d="M6 9l6 6 6-6"/></svg></button><span>DOWN</span></div>
  <div class="rb"><button aria-label="Level up" onclick="cmd('up')"><svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path class="ln" d="M6 15l6-6 6 6"/></svg></button><span>UP</span></div>
  <div class="rb"><button aria-label="Chamber poll" onclick="cyclePoll()">OK</button><span id="cPollL">POLL</span></div>
 </div>
</div>

<div class="keys" id="keys">
 <button aria-label="Level 1" onclick="cmd('level',1)">1</button><button aria-label="Level 2" onclick="cmd('level',2)">2</button>
 <button aria-label="Level 3" onclick="cmd('level',3)">3</button><button aria-label="Level 4" onclick="cmd('level',4)">4</button>
 <button aria-label="Level 5" onclick="cmd('level',5)">5</button><button aria-label="Level 6" onclick="cmd('level',6)">6</button>
</div>

<div id="common"></div>
</div>
<script>
var THEME='lcd',NOPOLL=true;
var ON='#ff2d78',OFFC='#1a1012',CY='#29d3ff',GH='#12262e',OR='#ff8a1f';
var SEG={a:'6,0 30,0 25,6 11,6',b:'30,6 36,1 36,31 33,33 30,30',c:'30,36 33,33 36,35 36,65 30,60',d:'11,60 25,60 30,66 6,66',
 e:'0,35 3,33 6,36 6,60 0,65',f:'0,1 6,6 6,30 3,33 0,31',g:'6,30 30,30 33,33 30,36 6,36 3,33'};
var MAP={'0':'abcdef','1':'bc','2':'abdeg','3':'abcdg','4':'bcfg','5':'acdfg','6':'acdefg','7':'abc','8':'abcdefg','9':'abcdfg','-':'g',' ':'','P':'abefg','E':'adefg','r':'eg'};
var BARS=['#3ddc84','#8be04e','#c9e43a','#ffd400','#ff9f1a','#ff4d2e'];
function glyphs(txt,on,off){var o='';for(var i=0;i<txt.length;i++){var s=MAP[txt.charAt(i)]||'';o+='<svg viewBox="0 0 36 66" aria-hidden="true">';
 for(var k in SEG)o+='<polygon points="'+SEG[k]+'" fill="'+(s.indexOf(k)>=0?on:off)+'"/>';o+='</svg>'}return o}
function fill(id,c){$(id).style.fill=c}
function stroke(id,c){$(id).style.stroke=c}
function draw(j,d){
 $('lmode').textContent=d.dead?'--':(j.mode||'--');$('link').style.color=j.stale?'#ff5a4d':CY;
 fill('lOff',d.off?CY:GH);fill('lStart',d.starting?CY:GH);fill('lRun',d.run&&!d.starting?CY:GH);fill('lCool',d.cool?CY:GH);fill('lErr',d.fault?'#ff3b30':GH);
 var txt='---',unit=H.unit=='F'?'°F':'°C',lab='CHAMBER',lit=false,say;
 if(d.dead){say='no data'}
 else if(d.fault){txt=d.ecode>=0?'E'+(d.ecode<10?'0':'')+Math.min(99,d.ecode):'Err';unit='';lit=true;say='fault '+d.ecodeStr}
 else if(d.c!==null){var v=Math.max(0,Math.min(999,Math.round(T(d.c))));txt=('   '+v).slice(-3);lit=true;say='chamber '+v+unit}
 else if(d.volts){txt=('   '+d.volts).slice(-3);unit='V';lab='SUPPLY';lit=true;say='supply '+d.volts+' volts'}
 else say='no reading';
 $('dig').innerHTML=glyphs(txt,ON,OFFC);$('dig').setAttribute('aria-label',say);
 $('du').textContent=unit;$('du').style.color=lit?ON:OFFC;$('dlab').textContent=lab;
 $('ptxt').textContent=d.desc.toUpperCase();$('ptxt').style.color=d.fault||d.dead?'#ff5a4d':CY;
 var lv=d.run&&d.level?d.level:3;
 stroke('iAir',d.fan?CY:GH);stroke('iFanR',d.fan?CY:GH);stroke('iFanB',d.fan?CY:GH);
 var f=$('iFan');f.setAttribute('class',d.fan?'spin':'');f.style.animationDuration=(1.3-lv*0.16).toFixed(2)+'s';
 stroke('iGlow',d.glow?OR:GH);fill('iGlowD',d.glow?OR:GH);
 var fl=$('iFlame');fl.style.opacity=d.burn?1:0;fl.style.transform='scale('+(0.55+lv*0.08).toFixed(2)+')';
 $('hico').setAttribute('aria-label','Heater '+d.label+', '+d.desc);
 stroke('iPump',d.pump?'#ffd400':GH);fill('iPump',d.pump?'rgba(255,212,0,0.25)':'none');$('iPumpS').setAttribute('class',d.pump?'blink':'');
 for(var i=0;i<6;i++)fill('lv'+i,d.run&&i<d.level?BARS[i]:'#16191e');
 $('pdig').innerHTML=glyphs(d.run?'P'+d.level:'--',OR,'#1a140c');
 var b=$('bPwr');b.disabled=!d.action;b.style.color=d.off?'#3ddc84':d.run?'#ff5a4d':d.canClear?'#ffb000':'#6b7480';
 $('cPwr').textContent=d.off?'START':d.run?'STOP':d.canClear?'CLEAR':'POWER';
 $('cPollL').textContent=j.poll<0?'POLL -':'POLL '+(j.poll>0?j.poll+'S':'OFF');
 var ks=$('keys').children;for(i=0;i<ks.length;i++)ks[i].className=d.run&&d.level==i+1?'sel':'';
}
</script>
<script src="/core.js?v=14"></script>
</body></html>
